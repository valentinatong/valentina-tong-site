name: Backup Airtable

on:
  schedule:
    - cron: "17 6 * * *"   # ~03:17 no horário de Brasília (BRT = UTC-3)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sincroniza dados do Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node scripts/backup-airtable.js
      - name: Commit se houver mudanças
        run: |
          git config user.name "airtable-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/airtable
          if git diff --cached --quiet; then
            echo "sem mudanças"
          else
            git commit -m "chore: sincroniza backup do Airtable"
            git push
          fi
