<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas Fotográfico — Valentina Tong</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#080d63;          /* mesmo azul configurado no Airtable — evita o flash cinza→azul na primeira pintura */
    --panel:#080d63;
    --line:#332f29;
    --paper:#EDEAE2;
    --tag-bg:#EDEAE2;      /* cor de fundo das tags/pills selecionadas — vem do Airtable */
    --stone:#8f887a;
    --stone-dim:#6a6459;
    --oxide:#B4552F;        /* accent */
    --title-font:"Fraunces", Georgia, serif;
    --body-font:"Newsreader", Georgia, serif;
    --mono-font:"Space Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--paper); font-family:var(--body-font); -webkit-font-smoothing:antialiased; }
  a{color:inherit;text-decoration:none;}

  /* top bar */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:24px;
    padding:16px 26px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:20; }
  .brand{ display:flex; align-items:center; gap:16px; }
  .seal{ width:54px; height:54px; border-radius:50%; border:1px solid var(--stone-dim); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:var(--mono-font); font-size:5.5px; letter-spacing:.1em; line-height:1.6; color:var(--stone); }
  .brand .kick{ font-family:var(--mono-font); font-size:10px; letter-spacing:.2em; color:var(--stone-dim); text-transform:uppercase; }
  .brand .h{ font-family:var(--title-font); font-weight:600; font-size:19px; }
  nav.main{ display:flex; gap:26px; font-family:var(--mono-font); font-size:11px; letter-spacing:.14em; }
  nav.main a{ color:var(--stone); } nav.main a:hover{ color:var(--paper); } nav.main a.on{ color:var(--paper); border-bottom:1px solid var(--oxide); padding-bottom:3px; }

  /* filter row */
  .filters{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:16px 26px; border-bottom:1px solid var(--line); }
  .filters .lab{ font-family:var(--mono-font); font-size:10px; letter-spacing:.2em; color:var(--stone-dim); margin-right:6px; }
  .pill{ font-family:var(--mono-font); font-size:11px; letter-spacing:.06em; color:var(--stone);
    border:1px solid var(--line); border-radius:999px; padding:6px 15px; cursor:pointer; background:transparent; }
  .pill:hover{ color:var(--paper); border-color:var(--stone-dim); }
  .pill.on{ color:var(--tag-fg, var(--bg)); background:var(--tag-bg); border-color:var(--tag-bg); }
  .pill.facet{ color:var(--oxide); border-color:var(--oxide); background:transparent; }
  .filtsel{ font-family:var(--mono-font); font-size:11px; letter-spacing:.06em; color:var(--stone);
    border:1px solid var(--line); border-radius:999px; padding:6px 26px 6px 15px; cursor:pointer;
    background-color:transparent; -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%238f887a' d='M1 1l5 5 5-5'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 12px center; background-size:9px 6px; max-width:180px; }
  .filtsel:hover{ color:var(--paper); border-color:var(--stone-dim); }
  .filtsel:focus{ outline:none; border-color:var(--oxide); }
  .filtsel.on{ color:var(--tag-fg, var(--bg)); background-color:var(--tag-bg); border-color:var(--tag-bg); }
  .filtsel option{ background:var(--panel); color:var(--paper); }
  .filters .mapbtn{ font-family:var(--mono-font); font-size:11px; letter-spacing:.12em; color:var(--stone);
    border:1px solid var(--line); border-radius:999px; padding:6px 15px; }
  .filters .mapbtn:hover{ color:var(--oxide); border-color:var(--oxide); }
  .filters #mapLink{ margin-left:auto; }

  /* body split: grid + ficha */
  .wrap{ display:grid; grid-template-columns: 1fr 360px; }
  .grid{ padding:26px; display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:26px 22px; align-content:start; }
  figure.cell{ margin:0; cursor:pointer; }
  figure.cell .imgbox{ aspect-ratio:1/1; overflow:hidden; background:#000; border:1px solid transparent; }
  figure.cell img{ width:100%; height:100%; object-fit:cover; display:block; }
  figure.cell figcaption{ font-family:var(--mono-font); font-size:10px; letter-spacing:.04em; color:var(--stone-dim); margin-top:8px; }
  figure.cell.sel .imgbox{ border-color:var(--oxide); }
  figure.cell.sel figcaption{ color:var(--oxide); }
  figure.cell:hover figcaption{ color:var(--stone); }

  /* ficha catalográfica */
  .ficha{ position:sticky; top:88px; align-self:start; height:calc(100vh - 88px); overflow-y:auto;
    border-left:1px solid var(--line); background:var(--panel); padding:26px 24px; }
  .ficha .preview{ width:100%; height:auto; background:#000; display:block; }
  .ficha .fichaBody{ opacity:0; transition:opacity .4s ease; }
  .ficha .fichaBody.loaded{ opacity:1; }
  .ficha .code{ font-family:var(--mono-font); font-size:14px; letter-spacing:.06em; color:var(--oxide); margin:18px 0 16px; }
  .ficha dl{ margin:0; display:grid; grid-template-columns: 118px 1fr; row-gap:11px; column-gap:10px; }
  .ficha dt{ font-family:var(--mono-font); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--stone-dim); align-self:center; }
  .ficha dd{ margin:0; font-family:var(--body-font); font-size:14px; color:var(--paper); }
  .ficha dd.dim{ color:var(--stone-dim); font-style:italic; }
  .ficha .tag{ color:var(--paper); cursor:pointer; border-bottom:1px solid transparent; text-decoration:none; }
  .ficha .tag:hover, .ficha .tag.on{ color:var(--oxide); border-bottom-color:var(--oxide); }
  .ficha .maplink{ font-family:var(--mono-font); font-size:11px; letter-spacing:.06em; color:var(--stone); }
  .ficha .maplink:hover{ color:var(--oxide); }
  .ficha .divider{ height:1px; background:var(--line); margin:22px 0; }
  .req{ display:block; text-align:center; width:100%; font-family:var(--mono-font); font-size:11px; letter-spacing:.14em;
    background:var(--oxide); color:#fff; padding:13px; border:none; cursor:pointer; }
  .req:hover{ filter:brightness(1.08); }
  .req-note{ font-family:var(--body-font); font-style:italic; font-size:12px; color:var(--stone-dim); text-align:center; margin-top:10px; line-height:1.5; }

  /* statement — aparece na ficha antes de clicar em qualquer foto */
  .statement h3{ font-family:var(--mono-font); font-weight:400; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--stone-dim); margin:0 0 18px; }
  .statement p{ font-family:var(--body-font); font-size:14.5px; line-height:1.65; color:var(--paper); margin:0 0 1.3em; }

  @media (max-width:900px){ .wrap{ grid-template-columns:1fr; } .ficha{ position:static; height:auto; border-left:none; border-top:1px solid var(--line); } }
</style>
  <script>
  // aplica a última cor conhecida (guardada no navegador) antes mesmo da primeira
  // pintura da página — evita o flash da cor padrão até a busca no Airtable terminar
  try {
    var cachedBg = localStorage.getItem("arquivoCorFundo");
    var cachedTag = localStorage.getItem("arquivoCorTag");
    var root = document.documentElement.style;
    if (cachedBg) { root.setProperty("--bg", cachedBg); root.setProperty("--panel", cachedBg); }
    if (cachedTag) root.setProperty("--tag-bg", cachedTag);
  } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" style="text-decoration:none;color:inherit" aria-label="Início">
      <div class="seal">VIAGEM<br>GEOLÓGICA<br>VALENTINA<br>TONG</div>
      <div><div class="kick">Viagem Geológica</div><div class="h">Atlas Fotográfico</div></div>
    </a>
    <nav class="main">
      <a href="index.html">HOME</a>
      <a href="projeto.html?p=pedras-marcadas">PROJETOS</a>
      <a href="arquivo.html" class="on">ATLAS FOTOGRÁFICO</a>
      <a href="curadoria.html">CURADORIA</a>
      <a href="bio.html">BIO</a>
      <a href="#" id="langToggle">EN</a>
    </nav>
  </header>

  <div class="filters" id="filters">
    <!-- selects injected -->
    <a class="mapbtn" href="mapa.html" id="mapLink">◍ MAPA</a>
    <a class="mapbtn" href="#" id="aboutBtn">SOBRE</a>
  </div>

  <main class="wrap">
    <section class="grid" id="grid"></section>
    <aside class="ficha" id="ficha"><!-- injected --></aside>
  </main>

  <script>
  // estado compartilhado entre os dois blocos de script abaixo (um busca as fotos,
  // outro busca o texto de abertura — podem terminar em qualquer ordem)
  window.__arquivoLang = new URL(location.href).searchParams.get("lang") === "en" ? "en" : "pt";
  window.__arquivo = { statementHTML: "", renderFicha: null };
  window.__arquivoStatementReady = function(html){
    window.__arquivo.statementHTML = html;
    if (window.__arquivo.renderFicha) window.__arquivo.renderFicha();
  };
  (async function(){
  // ---- data layer — vem do Airtable (base Arquivo, tabela Fotogramas,
  // só os marcados "Publicado no site"). Editar lá reflete aqui sozinho. Os
  // campos que aparecem na ficha (rótulo, ordem, liga/desliga) vêm da tabela
  // "Configuração de Campos" da mesma base — sem lista fixa aqui no código. ----
  let ITEMS = [];
  let CAMPOS = []; // [{campo, rotulo, ordem}, ...] — vem do /api/arquivo-fotos
  try {
    const r = await fetch("/api/arquivo-fotos" + (window.__arquivoLang === "en" ? "?lang=en" : ""));
    if (r.ok) { const d = await r.json(); ITEMS = d.fotos || []; CAMPOS = d.campos || []; }
  } catch (e) { /* sem fallback estático aqui — se a busca falhar, a grade fica vazia */ }
  ITEMS.sort((a,b)=> a.code.localeCompare(b.code, undefined, {numeric:true, sensitivity:"base"}));

  const lang = window.__arquivoLang;
  // as 7 categorias do filtro superior — Estado/Município já vêm como campos de
  // primeiro nível de cada foto; os demais vêm do mapa "valores" (Configuração de
  // Campos no Airtable). As opções de cada select são os valores distintos que já
  // aparecem nas fotos publicadas — não é uma lista fixa mantida à parte.
  const CATEGORIES = [
    { field: "projeto",   labelPT: "PROJETO",    labelEN: "PROJECT" },
    { field: "estado",    labelPT: "ESTADO",     labelEN: "STATE" },
    { field: "municipio", labelPT: "MUNICÍPIO",  labelEN: "MUNICIPALITY" },
    { field: "Local",     labelPT: "LOCAL",      labelEN: "LOCATION" },
    { field: "Ano",       labelPT: "ANO",        labelEN: "YEAR" },
    { field: "Geologia",  labelPT: "GEOLOGIA",   labelEN: "GEOLOGY" },
    { field: "Contexto",  labelPT: "CONTEXTO",   labelEN: "CONTEXT" },
  ];
  // tags da ficha para Estado/Município usam o nome de campo do Airtable
  // ("Estado"/"Município"); normaliza pros mesmos campos usados nos selects
  // acima, senão os dois viram filtros desencontrados.
  function normField(f){ return f==="Estado" ? "estado" : f==="Município" ? "municipio" : f; }

  let current = null; // nenhuma foto selecionada de início — ficha mostra o statement
  let active = {}; // filtros ativos por categoria: { [field]: value|null, ... } — combinam com E lógico
  // deep link vindo do mapa (mapa.html?municipio=X)
  const qMunicipio = new URL(location.href).searchParams.get("municipio");
  if (qMunicipio) active.municipio = qMunicipio;
  const grid=document.getElementById("grid"), fichaEl=document.getElementById("ficha"), filtersEl=document.getElementById("filters");

  function fieldVal(it,f){
    if(f==="projeto") return it.projeto;
    if(f==="estado") return it.estado;
    if(f==="municipio") return it.municipio;
    return (it.valores || {})[f];
  }
  function matches(it){
    return CATEGORIES.every(({field})=>{
      const chosen = active[field];
      if(!chosen) return true;
      const v = fieldVal(it, field);
      if(!v || (Array.isArray(v) && !v.length)) return false;
      return Array.isArray(v) ? v.includes(chosen) : String(v)===String(chosen);
    });
  }
  // "it" bate com os filtros ativos das categorias ANTES de "uptoIdx" na ordem de
  // CATEGORIES (Projeto, Estado, Município, Local, Ano, Geologia, Contexto) — é o
  // que faz a cascata andar só pra frente: Estado restringe Município/Local, mas
  // Município/Local nunca restringem Estado ou Projeto de volta (senão o próprio
  // select de Projeto ficaria preso depois que o Estado fosse preenchido sozinho).
  function matchesUpTo(it, uptoIdx){
    for(let i=0;i<uptoIdx;i++){
      const field = CATEGORIES[i].field;
      const chosen = active[field];
      if(!chosen) continue;
      const v = fieldVal(it, field);
      if(!v || (Array.isArray(v) && !v.length)) return false;
      if(!(Array.isArray(v) ? v.includes(chosen) : String(v)===String(chosen))) return false;
    }
    return true;
  }
  function optionsFor(idx){
    const field = CATEGORIES[idx].field;
    return [...new Set(ITEMS.filter(it=>matchesUpTo(it, idx)).flatMap(it=>{
      const v=fieldVal(it,field); return Array.isArray(v)?v:(v?[v]:[]);
    }))].sort((a,b)=> String(a).localeCompare(String(b), undefined, {numeric:true, sensitivity:"base"}));
  }

  const mapBtn = filtersEl.querySelector(".mapbtn");
  const selects = {};
  CATEGORIES.forEach(cat=>{
    const sel = document.createElement("select"); sel.className="filtsel"; sel.dataset.field=cat.field;
    sel.onchange = ()=> setFilter(cat.field, sel.value || null);
    filtersEl.insertBefore(sel, mapBtn);
    selects[cat.field] = sel;
  });

  // recalcula, em cascata (Projeto → Estado → Município → Local → ...), as opções
  // de cada select a partir dos OUTROS filtros já ativos — ex.: escolher um projeto
  // que só existe num estado já restringe (e preenche sozinho, se sobrar só um) o
  // select de Estado; escolher um estado restringe Município e Local, evitando
  // listas enormes. Se um valor já escolhido deixa de ser possível, ele é limpo.
  function refreshFilters(){
    CATEGORIES.forEach((cat, idx)=>{
      const options = optionsFor(idx);
      if(active[cat.field] && !options.some(v=>String(v)===String(active[cat.field]))) active[cat.field] = null;
      if(!active[cat.field] && options.length===1) active[cat.field] = String(options[0]);
      const label = lang==="en" ? cat.labelEN : cat.labelPT;
      const sel = selects[cat.field];
      sel.innerHTML = `<option value="">${label}</option>` +
        options.map(v=>`<option value="${String(v).replace(/"/g,"&quot;")}">${v}</option>`).join("");
      sel.value = active[cat.field] || "";
      sel.classList.toggle("on", !!active[cat.field]);
    });
    let el=document.getElementById("clearFilters");
    const hasActive = CATEGORIES.some(c=>active[c.field]);
    if(hasActive){
      if(!el){ el=document.createElement("button"); el.id="clearFilters"; el.className="pill facet"; filtersEl.insertBefore(el, mapBtn); }
      el.textContent = (lang==="en" ? "CLEAR FILTERS" : "LIMPAR FILTROS") + " ✕";
      el.onclick = ()=>{ CATEGORIES.forEach(c=>{ active[c.field]=null; }); refreshFilters(); pickFirstMatch(); renderGrid(); renderFicha(); };
    } else if(el){ el.remove(); }
  }

  // depois de mexer num filtro, a ficha passa a mostrar a primeira foto do
  // resultado — sem isso ela continuava mostrando a última foto clicada,
  // mesmo que essa foto nem batesse mais com os filtros escolhidos.
  function pickFirstMatch(){
    current = ITEMS.filter(it=>matches(it))[0] || null;
  }

  function setFilter(field, value, opts){
    field = normField(field);
    if((opts && opts.toggle) && active[field]===value) value = null;
    active[field] = value || null;
    // trocar um filtro limpa os que vêm depois dele na hierarquia (Projeto →
    // Estado → Município → Local → Ano → Geologia → Contexto) — senão sobra
    // combinação antiga que não faz mais sentido pro novo valor escolhido.
    const idx = CATEGORIES.findIndex(c=>c.field===field);
    for(let i=idx+1;i<CATEGORIES.length;i++) active[CATEGORIES[i].field] = null;
    refreshFilters(); pickFirstMatch(); renderGrid(); renderFicha();
  }

  function renderGrid(){
    grid.innerHTML="";
    ITEMS.filter(it=>matches(it)).forEach(it=>{
      const fig=document.createElement("figure"); fig.className="cell"+(current && it.code===current.code?" sel":"");
      fig.innerHTML=`<div class="imgbox"><img src="${it.thumb}" loading="lazy" alt="${it.code}"></div><figcaption>${it.code}</figcaption>`;
      fig.onclick=()=>{ current=it; renderGrid(); renderFicha(); };
      grid.appendChild(fig);
    });
    if(!grid.children.length) grid.innerHTML=`<p style="color:var(--stone-dim);font-family:var(--mono-font);font-size:12px;padding:10px">Nenhuma imagem com esse critério ainda.</p>`;
  }
  function mapHref(it){
    if (it && it.municipio && it.estado) {
      return `mapa.html?municipio=${encodeURIComponent(it.municipio)}&estado=${encodeURIComponent(it.estado)}`;
    }
    return "mapa.html";
  }
  function renderFicha(){
    if(!current){ fichaEl.innerHTML = `<div class="statement">${window.__arquivo.statementHTML}</div>`; return; }
    const rows = CAMPOS.map(({campo, rotulo})=>{
      const val = (current.valores || {})[campo];
      const empty = Array.isArray(val) ? !val.length : (val==null || val==="");
      if(empty) return `<dt>${rotulo}</dt><dd class="dim">-</dd>`;
      const vals = Array.isArray(val) ? val : [val];
      const tags = vals.map(v=>{ const av=active[normField(campo)]; const on=av!=null && String(av)===String(v);
        return `<a class="tag${on?" on":""}" data-field="${campo}" data-value="${String(v).replace(/"/g,"&quot;")}">${v}</a>`; }).join(", ");
      return `<dt>${rotulo}</dt><dd>${tags}</dd>`;
    }).join("");
    const subject = encodeURIComponent(`Pedido de acesso à imagem ${current.code}`);
    const bodym = encodeURIComponent(`Olá Valentina,\n\nGostaria de solicitar acesso à imagem ${current.code} (${current.projeto}) do Arquivo Viagem Geológica.\n\n`);
    fichaEl.innerHTML = `<div class="fichaBody">`+
      `<img class="preview" src="${current.thumb}" alt="${current.code}">`+
      `<div class="code">${current.code}</div>`+
      `<dl>${rows}</dl>`+
      `<div class="divider"></div>`+
      `<dl><dt>Localização</dt><dd><a class="maplink" href="${mapHref(current)}">Ver no mapa →</a></dd></dl>`+
      `<div class="divider"></div>`+
      `<a class="req" href="mailto:tongvalentina@gmail.com?subject=${subject}&body=${bodym}">SOLICITAR ACESSO À IMAGEM</a>`+
      `<div class="req-note">Imagens em alta resolução mediante pedido por e-mail.</div>`+
      `</div>`;
    const fichaBody = fichaEl.querySelector(".fichaBody");
    const previewImg = fichaEl.querySelector(".preview");
    const reveal = ()=> fichaBody.classList.add("loaded");
    if(previewImg.complete) reveal();
    else { previewImg.addEventListener("load", reveal); previewImg.addEventListener("error", reveal); }
    // a miniatura (já em cache da grade) aparece na hora; a versão em alta
    // resolução troca por cima assim que terminar de carregar, sem travar a abertura da ficha
    const hi = new Image();
    hi.onload = ()=> { if(current && current.code===previewImg.alt) previewImg.src = current.web; };
    hi.src = current.web;
  }
  fichaEl.addEventListener("click", e=>{ const t=e.target.closest(".tag"); if(t){ e.preventDefault(); setFilter(t.dataset.field, t.dataset.value, {toggle:true}); } });
  document.getElementById("aboutBtn").addEventListener("click", e=>{ e.preventDefault(); current=null; renderGrid(); renderFicha(); });
  window.__arquivo.renderFicha = renderFicha;
  refreshFilters();
  if (qMunicipio) pickFirstMatch(); // chegou por deep link já filtrado — mostra a primeira foto em vez do statement
  renderGrid(); renderFicha();
  })();
  </script>
  <script>
  // botão EN/PT — troca o parâmetro ?lang= na URL. O texto de abertura, os rótulos
  // e os campos/tags da ficha já vêm traduzidos do Airtable quando lang=en.
  (function(){
    var isEN = window.__arquivoLang === "en";
    var mapLink = document.getElementById("mapLink");
    if(mapLink) mapLink.textContent = (isEN ? "◍ MAP" : "◍ MAPA");
    var aboutBtn = document.getElementById("aboutBtn");
    if(aboutBtn) aboutBtn.textContent = (isEN ? "ABOUT" : "SOBRE");
    var el = document.getElementById("langToggle");
    if(!el) return;
    el.textContent = isEN ? "PT" : "EN";
    el.addEventListener("click", function(e){
      e.preventDefault();
      var u = new URL(location.href);
      u.searchParams.set("lang", isEN ? "pt" : "en");
      location.href = u.toString();
    });
  })();
  </script>
  <script>
  // cores vêm do Airtable (tabela Configurações da base Arquivo). "Cor de fundo" cobre
  // tanto o fundo da página quanto o painel da ficha à direita (--panel), pra não
  // ficarem descasados; "Cor da tag" é só o fundo das tags/pills selecionadas.
  // preto ou branco pro texto da tag, escolhido pelo brilho da cor de fundo dela —
  // assim o texto sempre fica legível não importa qual cor for escolhida no Airtable
  function readableTextColor(hex){
    const n = parseInt(hex.replace(/^#/,""), 16);
    const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
    return luminance > 0.6 ? "#1a1815" : "#EDEAE2";
  }
  // statement de abertura — some assim que a pessoa clica em qualquer foto (renderFicha
  // troca sozinho quando `current` deixa de ser null). Texto de reserva caso o Airtable falhe.
  const IS_EN = window.__arquivoLang === "en";
  const STATEMENT_FALLBACK_PT = "Este arquivo reúne uma seleção de fotografias produzidas desde 2014 em câmera de médio formato e filme 120, a partir de um acervo de mais de 2 mil fotogramas. São imagens de formações geológicas, sítios arqueológicos, áreas de extração mineral e paisagens transformadas pela natureza, pela arquitetura e pela construção do território.\n\nAs fotografias foram produzidas no curso de diferentes pesquisas e projetos, e são aqui reunidas como um campo aberto para novas relações, contextos e pesquisas. A organização deste arquivo é um esforço contínuo e autônomo de preservação e compartilhamento da minha prática. Para solicitar imagens em alta resolução, obter autorização para uso ou mais informações, entre em contato. Valentina Tong, 2026";
  const STATEMENT_FALLBACK_EN = "This archive brings together a selection of photographs produced since 2014 with a medium-format camera and 120 film, from a collection of more than 2,000 frames. They are images of geological formations, archaeological sites, mineral extraction areas, and landscapes transformed by nature, architecture, and the construction of territory.\n\nThe photographs were produced over the course of different research projects and are brought together here as an open field for new relationships, contexts, and research. The organization of this archive is an ongoing, independent effort to preserve and share my practice. To request high-resolution images, obtain permission for use, or for further information, please get in touch. Valentina Tong, 2026";
  function statementToHTML(s){
    const esc = s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const titulo = IS_EN ? "About the archive" : "Sobre o arquivo";
    return `<h3>${titulo}</h3>` + esc.split(/\n+/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${p}</p>`).join("");
  }
  window.__arquivoStatementReady(statementToHTML(IS_EN ? STATEMENT_FALLBACK_EN : STATEMENT_FALLBACK_PT));

  fetch("/api/config?base=arquivo").then(r=>r.ok?r.json():null).then(d=>{
    if(!d) return;
    const root = document.documentElement.style;
    if(d.corFundo){
      const c="#"+d.corFundo.trim().replace(/^#/,"");
      root.setProperty("--bg", c); root.setProperty("--panel", c);
      try { localStorage.setItem("arquivoCorFundo", c); } catch(e){}
    }
    if(d.corTag){
      const tagBg = "#"+d.corTag.trim().replace(/^#/,"");
      root.setProperty("--tag-bg", tagBg);
      root.setProperty("--tag-fg", readableTextColor(tagBg));
      try { localStorage.setItem("arquivoCorTag", tagBg); } catch(e){}
    }
    const texto = IS_EN ? (d.textoAberturaEN || d.textoAbertura) : d.textoAbertura;
    if(texto){
      window.__arquivoStatementReady(statementToHTML(texto));
    }
  }).catch(()=>{});
  </script>
  <script src="assets/no-drag.js"></script>
</body>
</html>
