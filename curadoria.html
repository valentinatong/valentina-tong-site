<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Curadoria, Pesquisa e Edição — Valentina Tong</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#ffffff; --ink:#201D19; --stone:#86806F; --stone-dim:#a49d8f; --oxide:#9A4A2C;
    --line:rgba(32,29,25,.14);
    --title-font:"Fraunces", Georgia, serif;
    --body-font:"Newsreader", Georgia, serif;
    --mono-font:"Space Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:var(--body-font); -webkit-font-smoothing:antialiased; }
  a{color:inherit;text-decoration:none;}

  .top{ display:flex; align-items:baseline; justify-content:space-between; gap:24px; padding:26px 40px 22px; }
  .top .h{ font-family:var(--mono-font); font-size:12px; letter-spacing:.2em; color:var(--ink); }
  nav.main{ display:flex; gap:26px; font-family:var(--mono-font); font-size:11px; letter-spacing:.14em; }
  nav.main a{ color:var(--stone); } nav.main a:hover{ color:var(--ink); } nav.main a.on{ color:var(--ink); border-bottom:1px solid var(--oxide); padding-bottom:3px; }

  /* lista de curadoria — grade de 3 colunas: título+texto | tipo+locais | miniatura.
     Nomes com prefixo cz- para não colidir com classes globais (ex.: .panel). */
  .cz-list{ padding:0 40px 12vh; }
  .cz-item{ border-top:1px solid var(--line); cursor:pointer; }
  .cz-item.open{ cursor:default; }
  .cz-item:last-child{ border-bottom:1px solid var(--line); }
  .cz-row{ display:grid; grid-template-columns:48% 1fr 96px; gap:32px; align-items:start; padding:22px 0 24px; }
  .cz-title{ font:500 18px/24px var(--title-font); display:flex; gap:10px; align-items:baseline; cursor:pointer; }
  .cz-plus{ font:12px var(--mono-font); color:var(--stone); width:10px; flex:0 0 10px; transition:transform .3s; }
  .cz-item.open .cz-plus{ transform:rotate(45deg); color:var(--oxide); }
  .cz-item.open .cz-title{ color:var(--oxide); }
  .cz-tr{ font:italic 15px/24px var(--body-font); color:var(--stone); margin:0 0 4px; }
  .cz-v{ display:grid; grid-template-columns:50px 1fr; gap:8px; padding:2px 0; }
  .cz-v .y{ font:11px/21px var(--mono-font); letter-spacing:.04em; color:var(--stone); font-variant-numeric:tabular-nums; }
  .cz-v .l{ font:14px/21px var(--body-font); }
  .cz-sedes .cz-v{ border-top:1px solid rgba(32,29,25,.07); }
  .cz-thumb{ justify-self:end; width:96px; height:64px; margin-top:4px; }
  .cz-thumb img{ width:96px; height:64px; object-fit:contain; object-position:right top; display:block; transition:opacity .3s; }
  .cz-item.open .cz-thumb img{ opacity:0; }

  /* partes que abrem — transição de altura via grid-template-rows */
  .cz-fold{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .5s cubic-bezier(.2,.7,.2,1); }
  .cz-item.open .cz-fold{ grid-template-rows:1fr; }
  .cz-fold > div{ overflow:hidden; min-height:0; }
  .cz-desc{ margin:14px 0 0; padding-left:20px; font:15.5px/1.6 var(--body-font); max-width:64ch; }
  .cz-strip{ display:flex; gap:10px; overflow-x:auto; padding:6px 0 30px 20px; scrollbar-width:thin; }
  .cz-strip img{ height:170px; width:auto; display:block; cursor:zoom-in; flex:0 0 auto; }
  .cz-strip::-webkit-scrollbar{ height:6px; } .cz-strip::-webkit-scrollbar-thumb{ background:var(--line); }

  /* imagem ampliada ao passar o mouse na fileira */
  .cz-zoom{ position:fixed; z-index:60; margin:0; left:0; top:0; pointer-events:none; opacity:0; transition:opacity .2s;
    background:#fff; padding:0 0 10px; box-shadow:0 18px 50px rgba(32,29,25,.18); }
  .cz-zoom.on{ opacity:1; }
  .cz-zoom img{ display:block; max-height:62vh; max-width:56vw; }
  .cz-zoom figcaption{ padding:10px 12px 0; font:10px/1.5 var(--mono-font); letter-spacing:.1em; text-transform:uppercase; color:var(--stone); max-width:56vw; }
  .cz-zoom figcaption b{ display:block; font:italic 400 14px/1.4 var(--body-font); letter-spacing:0; text-transform:none; color:var(--ink); }
  /* imagem com link (campo Link da Galeria): o zoom aceita o mouse e a legenda vira link */
  .cz-zoom.on.link{ pointer-events:auto; }
  .cz-zoom figcaption a{ display:block; color:inherit; }
  .cz-zoom figcaption a:hover, .cz-zoom figcaption a:hover b{ color:var(--oxide); }
  .cz-zoom figcaption a:hover b{ text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; }
  /* flechinha de link externo — inline-block para não herdar o sublinhado */
  .cz-ext{ display:inline-block; margin-left:5px; font:12px/1 var(--mono-font); font-style:normal; color:var(--stone); }
  .cz-zoom figcaption a:hover .cz-ext{ color:var(--oxide); }

  @media (max-width:760px){
    .cz-list{ padding:0 22px 12vh; }
    .cz-row{ grid-template-columns:1fr; gap:10px; }
    .cz-thumb{ display:none; }
    .cz-row > div:nth-child(2){ padding-left:20px; }
    .cz-strip img{ cursor:default; }
    .cz-zoom{ display:none; }
  }

  @media (max-width:800px){
    .top{ flex-direction:column; gap:14px; padding:20px 22px; }
  }
</style>
</head>
<body>
  <header class="top">
    <div class="h">CURADORIA, PESQUISA E EDIÇÃO</div>
    <nav class="main">
      <a href="index.html">HOME</a>
      <a href="projetos.html">PROJETOS</a>
      <a href="arquivo.html">ATLAS FOTOGRÁFICO</a>
      <a href="curadoria.html" class="on">CURADORIA</a>
      <a href="bio.html">BIO</a>
      <a href="#" id="langToggle">EN</a>
    </nav>
  </header>

  <main class="cz-list" id="list"></main>

  <script>
  // ---- camada de dados — vem do Airtable (base Curadoria: Projetos → Itinerâncias).
  // Cada Projeto vira UMA linha: título | tipo · papel + "ano | local" | miniatura.
  // Ao abrir, aparecem o texto, as sedes (itinerâncias) e a fileira de imagens.
  // Editar no Airtable reflete aqui sozinho, sem redeploy. ----
  (async function(){
    const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "pt";
    let ITEMS = [];
    var vtP = function(u){ return /(?:^|; )vt_preview=1(?:;|$)/.test(document.cookie) ? u+(u.indexOf("?")===-1?"?":"&")+"_preview="+Date.now() : u; };
    try {
      const r = await fetch(vtP("/api/curadoria?lang=" + lang));
      if (r.ok) { const d = await r.json(); ITEMS = d.itens || []; }
    } catch (e) { /* sem fallback estático — se a busca falhar, a lista fica vazia */ }

    const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
    const venue = (ano, local) => `<div class="cz-v"><span class="y">${esc(ano)}</span><span class="l">${esc(local)}</span></div>`;
    const lugar = (local, ano) => [local, ano].filter(Boolean).join(" — ");
    const list = document.getElementById("list");

    list.innerHTML = ITEMS.map(c => {
      const sedes = c.sedes || [];
      // imagens do projeto seguidas das imagens das sedes; legenda da imagem (se houver)
      // substitui "local — ano"
      const imgs = [
        ...(c.imgs || []).map(g => ({ ...g, cap: g.legenda || lugar(c.local, c.ano) })),
        ...sedes.flatMap(s => (s.imgs || []).map(g => ({ ...g, cap: g.legenda || lugar(s.local, s.ano) })))
      ];
      const tr = [c.tipo, c.papel].filter(Boolean).map(esc).join(" · ");
      return `<article class="cz-item">
        <div class="cz-row">
          <div>
            <div class="cz-title"><span class="cz-plus">+</span><span>${esc(c.titulo)}</span></div>
            ${c.desc ? `<div class="cz-fold"><div><p class="cz-desc">${esc(c.desc)}</p></div></div>` : ""}
          </div>
          <div>
            ${tr ? `<div class="cz-tr">${tr}</div>` : ""}
            ${(c.local || c.ano) ? venue(c.ano, c.local) : ""}
            ${sedes.length ? `<div class="cz-fold"><div class="cz-sedes">${sedes.map(s => venue(s.ano, s.local)).join("")}</div></div>` : ""}
          </div>
          <div class="cz-thumb">${c.imgs && c.imgs[0] ? `<img src="${esc(c.imgs[0].thumb)}" alt="${esc(c.titulo)}">` : ""}</div>
        </div>
        ${imgs.length ? `<div class="cz-fold"><div><div class="cz-strip">${imgs.map(g =>
          `<img src="${esc(g.thumb)}" data-web="${esc(g.web)}" data-cap="${esc(g.cap)}" data-t="${esc(c.titulo)}"${g.link ? ` data-link="${esc(g.link)}"` : ""} alt="${esc(c.titulo)}" loading="lazy">`
        ).join("")}</div></div></div>` : ""}
      </article>`;
    }).join("");

    // fechado: clicar em qualquer lugar abre; aberto: só o título fecha. Um aberto por vez.
    list.querySelectorAll(".cz-item").forEach(a => a.addEventListener("click", e => {
      const open = a.classList.contains("open");
      if (open && !e.target.closest(".cz-title")) return;
      hide();
      list.querySelectorAll(".cz-item.open").forEach(x => x.classList.remove("open"));
      if (!open) a.classList.add("open");
    }));

    // hover numa imagem da fileira: versão maior flutuando sobre a página (só desktop)
    const canHover = matchMedia("(hover: hover) and (min-width: 761px)");
    const z = document.createElement("figure");
    z.className = "cz-zoom";
    z.innerHTML = '<img alt=""><figcaption></figcaption>';
    document.body.appendChild(z);
    const zi = z.querySelector("img"), zc = z.querySelector("figcaption");
    let current = null, hideTimer = null, ready = false;
    const place = () => {
      if (!current || !ready || !canHover.matches) return;
      const r = current.getBoundingClientRect(), w = z.offsetWidth, h = z.offsetHeight;
      const x = Math.max(16, Math.min(innerWidth - w - 16, r.left + r.width / 2 - w / 2));
      const y = Math.max(70, Math.min(innerHeight - h - 16, r.top + r.height / 2 - h / 2));
      z.style.left = x + "px"; z.style.top = y + "px"; z.classList.add("on");
    };
    const hide = () => { clearTimeout(hideTimer); current = null; ready = false; z.classList.remove("on"); };
    // pequeno atraso para dar tempo de o mouse passar da miniatura para o zoom
    const hideSoon = () => { clearTimeout(hideTimer); hideTimer = setTimeout(hide, 120); };
    const isStripImg = t => t && t.tagName === "IMG" && t.parentElement.classList.contains("cz-strip");
    // legenda e posição só mudam quando a imagem grande terminou de carregar, para nunca
    // aparecer a legenda de uma foto com a imagem de outra (ou a caixa vazia)
    const apply = () => {
      const t = current;
      // com link: a legenda abre o site em outra aba (o zoom passa a aceitar o mouse)
      const texto = `<b>${esc(t.dataset.t)}${t.dataset.link ? '<span class="cz-ext">↗</span>' : ""}</b>${esc(t.dataset.cap)}`;
      zc.innerHTML = t.dataset.link
        ? `<a href="${esc(t.dataset.link)}" target="_blank" rel="noopener">${texto}</a>` : texto;
      z.classList.toggle("link", !!t.dataset.link);
      ready = true;
      place();
    };
    zi.onload = () => { if (current && zi.getAttribute("src") === current.dataset.web) apply(); };
    const show = t => {
      clearTimeout(hideTimer);
      current = t;
      // pré-carrega a vizinha da direita, para as setas ficarem rápidas
      const nb = t.nextElementSibling;
      if (nb && nb.dataset.web) new Image().src = nb.dataset.web;
      if (zi.getAttribute("src") !== t.dataset.web) { ready = false; zi.src = t.dataset.web; }
      else if (zi.complete) apply();
    };
    // navegando pelas setas: ignora os eventos de mouse "falsos" que o navegador dispara
    // quando a fileira rola sob o cursor parado; volta ao normal quando o mouse se mexe
    let keyNav = false;
    addEventListener("mousemove", () => { keyNav = false; }, { passive: true });

    list.addEventListener("mouseover", e => {
      if (keyNav || !canHover.matches || !isStripImg(e.target)) return;
      show(e.target);
    });
    list.addEventListener("mouseout", e => {
      if (!keyNav && e.target === current && !z.contains(e.relatedTarget)) hideSoon();
    });
    z.addEventListener("mouseenter", () => clearTimeout(hideTimer));
    z.addEventListener("mouseleave", e => { if (!keyNav && e.relatedTarget !== current) hideSoon(); });

    // setas ← → percorrem as imagens do item aberto (Esc fecha o zoom)
    addEventListener("keydown", e => {
      if (e.key === "Escape") { hide(); return; }
      if ((e.key !== "ArrowRight" && e.key !== "ArrowLeft") || e.metaKey || e.ctrlKey || e.altKey) return;
      const strip = list.querySelector(".cz-item.open .cz-strip");
      if (!strip) return;
      const imgs = [...strip.children];
      const i = imgs.indexOf(current);
      const next = i === -1 ? imgs[e.key === "ArrowRight" ? 0 : imgs.length - 1]
        : imgs[Math.max(0, Math.min(imgs.length - 1, i + (e.key === "ArrowRight" ? 1 : -1)))];
      e.preventDefault();
      keyNav = true;
      next.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
      if (canHover.matches) show(next); else current = next;
    });
    // celular (sem zoom): tocar numa imagem com link abre o site
    list.addEventListener("click", e => {
      const t = e.target;
      if (!canHover.matches && t.tagName === "IMG" && t.dataset.link) open(t.dataset.link, "_blank", "noopener");
    });
    // rolar a página ou a fileira desloca a miniatura: com o mouse, fecha o zoom;
    // pelas setas, o zoom acompanha a miniatura enquanto a fileira rola
    addEventListener("scroll", () => { if (keyNav) place(); else hide(); }, { passive: true, capture: true });
  })();
  </script>
  <script>
  // botão EN/PT — troca o parâmetro ?lang= na URL. Ainda não traduz o conteúdo desta
  // página (só projeto.html lê o Airtable bilíngue por enquanto), mas já fica no lugar.
  (function(){
    var url = new URL(location.href);
    var isEN = url.searchParams.get("lang") === "en";
    var el = document.getElementById("langToggle");
    if(!el) return;
    el.textContent = isEN ? "PT" : "EN";
    el.addEventListener("click", function(e){
      e.preventDefault();
      var u = new URL(location.href);
      u.searchParams.set("lang", isEN ? "pt" : "en");
      location.href = u.toString();
    });
  })();
  </script>
  <script>
  // cor de fundo vem do Airtable (tabela Configurações da base Curadoria, campo "Cor de fundo")
  var vtP2 = function(u){ return /(?:^|; )vt_preview=1(?:;|$)/.test(document.cookie) ? u+(u.indexOf("?")===-1?"?":"&")+"_preview="+Date.now() : u; };
  fetch(vtP2("/api/config?base=curadoria")).then(r=>r.ok?r.json():null).then(d=>{
    if(d && d.corFundo) document.documentElement.style.setProperty("--bg", "#"+d.corFundo.trim().replace(/^#/,""));
  }).catch(()=>{});
  </script>
  <script src="assets/no-drag.js"></script>
</body>
</html>
