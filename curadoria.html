<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Curadoria, Pesquisa e Edição — Valentina Tong</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#ffffff; --ink:#201D19; --stone:#86806F; --stone-dim:#a49d8f; --oxide:#9A4A2C;
    --line:rgba(32,29,25,.14);
    --title-font:"Fraunces", Georgia, serif;
    --body-font:"Newsreader", Georgia, serif;
    --mono-font:"Space Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:var(--body-font); -webkit-font-smoothing:antialiased; }
  a{color:inherit;text-decoration:none;}

  .top{ display:flex; align-items:baseline; justify-content:space-between; gap:24px; padding:26px 40px 22px; }
  .top .h{ font-family:var(--mono-font); font-size:12px; letter-spacing:.2em; color:var(--ink); }
  nav.main{ display:flex; gap:26px; font-family:var(--mono-font); font-size:11px; letter-spacing:.14em; }
  nav.main a{ color:var(--stone); } nav.main a:hover{ color:var(--ink); } nav.main a.on{ color:var(--ink); border-bottom:1px solid var(--oxide); padding-bottom:3px; }

  .list{ padding:0 40px 12vh; }
  .item{ border-top:1px solid var(--line); }
  .item:last-child{ border-bottom:1px solid var(--line); }
  .row{ display:grid; grid-template-columns: 1.5fr 1.25fr 150px; gap:28px; align-items:center; padding:22px 0; }
  .item.expandable .row{ cursor:pointer; }
  .title-col{ display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  .title{ font-family:var(--title-font); font-weight:500; font-size:19px; line-height:1.2; display:flex; gap:10px; align-items:baseline; }
  .item.expandable:hover .title{ color:var(--oxide); }
  .title .plus{ font-family:var(--mono-font); font-size:14px; color:var(--stone-dim); flex:0 0 auto; transition:transform .2s; }
  .item.open .title .plus{ transform:rotate(45deg); color:var(--oxide); }
  .meta .tr{ font-family:var(--mono-font); font-size:11px; letter-spacing:.06em; color:var(--stone); text-transform:uppercase; }
  .meta .vy{ font-family:var(--body-font); font-style:italic; font-size:14.5px; color:var(--stone); margin-top:5px; }
  .thumb{ justify-self:end; }
  .thumb img{ height:82px; width:auto; max-width:150px; object-fit:contain; display:block; }
  .thumb.empty{ width:150px; height:82px; }

  .panel{ overflow:hidden; max-height:0; transition:max-height .32s ease; }
  .item.open .panel{ max-height:560px; }
  .panel-inner{ padding:2px 0 30px; }
  .desc{ font-family:var(--body-font); font-size:15.5px; line-height:1.6; color:var(--ink); max-width:64ch; margin:0 0 18px; }
  .gallery{ display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; scrollbar-width:thin; }
  .gallery img{ height:240px; width:auto; object-fit:contain; display:block; background:#f3f2ef; }
  .gallery::-webkit-scrollbar{ height:6px; } .gallery::-webkit-scrollbar-thumb{ background:var(--line); }

  /* link "Itinerâncias (N)" abaixo do título — abre/fecha a lista de sedes,
     independente do clique no título (que abre o texto de apresentação) */
  .itin-toggle{ font-family:var(--mono-font); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--stone); cursor:pointer; display:flex; align-items:center; gap:6px; }
  .itin-toggle:hover{ color:var(--oxide); }
  .itin-toggle .plus{ font-size:12px; transition:transform .2s; }
  .itin-wrap.open .itin-toggle .plus{ transform:rotate(45deg); }

  .itin-list{ overflow:hidden; max-height:0; transition:max-height .35s ease; }
  .itin-wrap.open .itin-list{ max-height:2000px; }
  .itin-list-inner{ padding:4px 0 22px; }
  .itin{ border-top:1px solid var(--line); }
  .itin-row{ display:grid; grid-template-columns: 1.5fr 1.25fr 150px; gap:28px; align-items:center; padding:14px 0; padding-left:24px; }
  .itin.clickable .itin-row{ cursor:pointer; }
  .itin.clickable:hover .itin-row .itin-vy{ color:var(--oxide); }
  .itin-vy{ font-family:var(--body-font); font-style:normal; font-size:13px; color:var(--stone); }
  .itin-thumb{ justify-self:end; }
  .itin-thumb img{ height:64px; width:auto; max-width:130px; object-fit:contain; display:block; }
  .itin-panel{ overflow:hidden; max-height:0; transition:max-height .3s ease; }
  .itin.open .itin-panel{ max-height:280px; }
  .itin-panel-inner{ padding:2px 0 18px 24px; }
  .itin-panel-inner .gallery img{ height:180px; }

  @media (max-width:800px){
    .top{ flex-direction:column; gap:14px; padding:20px 22px; }
    .row, .itin-row{ grid-template-columns:1fr; gap:10px; }
    .thumb{ justify-self:start; } .thumb img{ height:120px; }
    .itin-thumb{ justify-self:start; }
  }
</style>
</head>
<body>
  <header class="top">
    <div class="h">CURADORIA, PESQUISA E EDIÇÃO</div>
    <nav class="main">
      <a href="index.html">HOME</a>
      <a href="projeto.html?p=pedras-marcadas">PROJETOS</a>
      <a href="arquivo.html">ARQUIVO FOTOGRÁFICO</a>
      <a href="curadoria.html" class="on">CURADORIA</a>
      <a href="bio.html">BIO</a>
      <a href="#" id="langToggle">EN</a>
    </nav>
  </header>

  <main class="list" id="list"></main>

  <script>
  // ---- camada de dados — vem do Airtable (base Curadoria: Projetos → Itinerâncias →
  // Galeria). Cada Projeto vira UMA linha. Se tiver sedes (trabalho itinerante), elas só
  // aparecem quando clica no link "Itinerâncias" abaixo do título — não abrem sozinhas.
  // Editar no Airtable reflete aqui sozinho, sem redeploy. ----
  (async function(){
    const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "pt";
    const ROTULO_ITIN = lang === "en" ? "Itineraries" : "Itinerâncias";
    let ITEMS = [];
    try {
      const r = await fetch("/api/curadoria?lang=" + lang);
      if (r.ok) { const d = await r.json(); ITEMS = d.itens || []; }
    } catch (e) { /* sem fallback estático — se a busca falhar, a lista fica vazia */ }

    const list=document.getElementById("list");
    ITEMS.forEach(it=>{
      const isItinerante = Array.isArray(it.sedes) && it.sedes.length > 0;
      // "expandable" controla só o clique/hover/"+" do TÍTULO (abre a descrição) — o
      // link de Itinerâncias é um gatilho separado, com seu próprio "+", tratado à parte
      const expandable = !!it.desc;
      const el=document.createElement("article"); el.className="item"+(expandable?" expandable":"");

      const firstThumb = (!isItinerante && it.imgs && it.imgs.length) ? `<img src="${it.imgs[0].thumb}" alt="${it.titulo}">` : "";
      const gallery = (!isItinerante && it.imgs && it.imgs.length) ? `<div class="gallery">${it.imgs.map(im=>`<img src="${im.web}" alt="${it.titulo}">`).join("")}</div>` : "";
      const desc = it.desc ? `<p class="desc">${it.desc}</p>` : "";
      const vy = isItinerante ? "" : `<div class="vy">${it.local} — ${it.ano}</div>`;
      const itinToggle = isItinerante
        ? `<a class="itin-toggle"><span class="plus">+</span>${ROTULO_ITIN} (${it.sedes.length})</a>` : "";

      const itinListHTML = isItinerante ? it.sedes.map(sede=>{
        const sedeThumb = sede.imgs && sede.imgs.length ? `<img src="${sede.imgs[0].thumb}" alt="${it.titulo}">` : "";
        const sedeGallery = sede.imgs && sede.imgs.length ? `<div class="gallery">${sede.imgs.map(im=>`<img src="${im.web}" alt="${it.titulo}">`).join("")}</div>` : "";
        const clickable = sede.imgs && sede.imgs.length;
        return `<div class="itin${clickable?' clickable':''}">
          <div class="itin-row">
            <div class="itin-vy">${sede.local} — ${sede.ano}</div>
            <div></div>
            <div class="itin-thumb">${sedeThumb}</div>
          </div>
          <div class="itin-panel"><div class="itin-panel-inner">${sedeGallery}</div></div>
        </div>`;
      }).join("") : "";

      el.innerHTML =
        `<div class="row">
          <div class="title-col">
            <div class="title">${expandable?'<span class="plus">+</span>':''}<span>${it.titulo}</span></div>
            ${itinToggle}
          </div>
          <div class="meta"><div class="tr">${it.tipo} · ${it.papel}</div>${vy}</div>
          <div class="thumb ${firstThumb?'':'empty'}">${firstThumb}</div>
        </div>
        <div class="panel"><div class="panel-inner">${desc}${gallery}</div></div>
        ${isItinerante?`<div class="itin-wrap"><div class="itin-list"><div class="itin-list-inner">${itinListHTML}</div></div></div>`:""}`;

      if(desc){ el.querySelector(".row").addEventListener("click", ()=> el.classList.toggle("open")); }
      const itinToggleEl = el.querySelector(".itin-toggle");
      if(itinToggleEl){
        itinToggleEl.addEventListener("click", e=>{
          e.stopPropagation();
          el.querySelector(".itin-wrap").classList.toggle("open");
        });
      }
      el.querySelectorAll(".itin.clickable .itin-row").forEach(row=>{
        row.addEventListener("click", ()=> row.closest(".itin").classList.toggle("open"));
      });
      list.appendChild(el);
    });
  })();
  </script>
  <script>
  // botão EN/PT — troca o parâmetro ?lang= na URL. Ainda não traduz o conteúdo desta
  // página (só projeto.html lê o Airtable bilíngue por enquanto), mas já fica no lugar.
  (function(){
    var url = new URL(location.href);
    var isEN = url.searchParams.get("lang") === "en";
    var el = document.getElementById("langToggle");
    if(!el) return;
    el.textContent = isEN ? "PT" : "EN";
    el.addEventListener("click", function(e){
      e.preventDefault();
      var u = new URL(location.href);
      u.searchParams.set("lang", isEN ? "pt" : "en");
      location.href = u.toString();
    });
  })();
  </script>
  <script>
  // cor de fundo vem do Airtable (tabela Configurações da base Curadoria, campo "Cor de fundo")
  fetch("/api/config?base=curadoria").then(r=>r.ok?r.json():null).then(d=>{
    if(d && d.corFundo) document.documentElement.style.setProperty("--bg", "#"+d.corFundo.trim().replace(/^#/,""));
  }).catch(()=>{});
  </script>
  <script src="assets/no-drag.js"></script>
</body>
</html>
