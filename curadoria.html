<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Curadoria, Pesquisa e Edição — Valentina Tong</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#ffffff; --ink:#201D19; --stone:#6f6a5c; --stone-dim:#a49d8f; --oxide:#9A4A2C; --card:#ffffff; --cell:transparent;
    --line:rgba(32,29,25,.14);
    --title-font:"Fraunces", Georgia, serif;
    --body-font:"Newsreader", Georgia, serif;
    --mono-font:"Space Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:var(--body-font); -webkit-font-smoothing:antialiased; }
  a{color:inherit;text-decoration:none;}

  .top{ display:flex; align-items:baseline; justify-content:space-between; gap:24px; padding:26px 40px 22px; }
  .top .h{ font-family:var(--mono-font); font-size:12px; letter-spacing:.2em; color:var(--ink); }
  nav.main{ display:flex; gap:26px; font-family:var(--mono-font); font-size:11px; letter-spacing:.14em; }
  nav.main a{ color:var(--stone); } nav.main a:hover{ color:var(--ink); } nav.main a.on{ color:var(--ink); border-bottom:1px solid var(--oxide); padding-bottom:3px; }

  /* lista de curadoria — grade de 3 colunas: título+texto | tipo+locais | miniatura.
     Nomes com prefixo cz- para não colidir com classes globais (ex.: .panel). */
  .cz-list{ padding:0 40px 12vh; }
  .cz-item{ border-top:1px solid var(--line); cursor:pointer; }
  .cz-item.open{ cursor:default; }
  .cz-item:last-child{ border-bottom:1px solid var(--line); }
  .cz-row{ display:grid; grid-template-columns:48% 1fr 96px; gap:32px; align-items:start; padding:22px 0 24px; }
  .cz-title{ font:500 18px/24px var(--title-font); cursor:pointer; transition:color .2s; }
  .cz-item.open .cz-title{ color:var(--oxide); }
  /* linha clicável: hover discreto no título (cor de destaque a 80%) */
  .cz-item:not(.open) .cz-row{ cursor:pointer; }
  .cz-item:not(.open) .cz-row:hover .cz-title, .cz-title:hover{ color:rgba(154,74,44,.8); }
  .cz-tr{ font:italic 15px/24px var(--body-font); color:var(--stone); margin:0 0 4px; }
  .cz-v{ display:grid; grid-template-columns:50px 1fr; gap:8px; padding:2px 0; }
  .cz-v .y{ font:12px/21px var(--mono-font); letter-spacing:.04em; color:var(--stone); font-variant-numeric:tabular-nums; }
  .cz-v .l{ font:14px/21px var(--body-font); }
  .cz-v .l a{ color:inherit; }
  .cz-v .l a:hover{ color:var(--oxide); }
  .cz-v .l a:hover .cz-cap{ text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; }
  .cz-sedes .cz-v{ border-top:1px solid rgba(32,29,25,.07); }
  .cz-thumb{ justify-self:end; width:96px; height:64px; margin-top:4px; }
  .cz-thumb img{ width:96px; height:64px; object-fit:contain; object-position:right top; display:block; transition:opacity .3s; }
  .cz-item.open .cz-thumb img{ opacity:0; }

  /* partes que abrem — transição de altura via grid-template-rows */
  .cz-fold{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .5s cubic-bezier(.2,.7,.2,1); }
  .cz-item.open .cz-fold{ grid-template-rows:1fr; }
  .cz-fold > div{ overflow:hidden; min-height:0; }
  .cz-list strong{ font-weight:600; }
  .cz-desc{ margin:14px 0 0; font:15.5px/1.6 var(--body-font); max-width:64ch; }
  .cz-strip{ display:flex; gap:10px; overflow-x:auto; padding:6px 0 30px; scrollbar-width:thin; }
  /* "célula" atrás de imagens com fundo transparente: campo "Cor da imagem" do Airtable */
  .cz-strip img, .cz-zoom img, .cz-thumb img.cz-tr{ background-color:var(--cell); }
  .cz-strip img{ height:170px; width:auto; display:block; cursor:zoom-in; flex:0 0 auto; }
  /* vídeo do YouTube na fileira: miniatura com ▶ por cima */
  .cz-vid{ position:relative; flex:0 0 auto; cursor:pointer; }
  .cz-strip .cz-vid img{ cursor:pointer; }
  .cz-play{ position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%;
    background:rgba(255,255,255,.92); box-shadow:0 2px 10px rgba(32,29,25,.18); pointer-events:none; }
  .cz-play::before{ content:""; position:absolute; left:18px; top:14px; border-style:solid;
    border-width:9px 0 9px 14px; border-color:transparent transparent transparent var(--ink); }
  .cz-strip::-webkit-scrollbar{ height:6px; } .cz-strip::-webkit-scrollbar-thumb{ background:var(--line); }

  /* imagem ampliada ao passar o mouse na fileira */
  .cz-zoom{ position:fixed; z-index:60; margin:0; left:0; top:0; pointer-events:none; opacity:0; transition:opacity .2s;
    background:var(--card); padding:0 0 10px; box-shadow:0 18px 50px rgba(32,29,25,.18); }
  .cz-zoom.on{ opacity:1; }
  /* a altura (62vh) é o limite principal; panorâmicas podem ocupar a largura toda da tela */
  .cz-zoom img{ display:block; max-height:62vh; max-width:calc(100vw - 32px); }
  .cz-zi{ position:relative; }
  .cz-zoom .cz-play{ display:none; transform:scale(1.35); }
  .cz-zoom.video .cz-play{ display:block; }
  .cz-zoom.on.video{ pointer-events:auto; }
  .cz-zoom.video .cz-zi{ cursor:pointer; }
  /* width:0 + min-width:100%: a legenda não alarga a caixa; acompanha a largura da foto e quebra linha */
  .cz-zoom figcaption{ padding:10px 12px 0; font:14px/1.4 var(--body-font); color:var(--ink); width:0; min-width:100%; }
  /* imagem com link (campo Link da Galeria): o zoom aceita o mouse e a legenda vira link */
  .cz-zoom.on.link{ pointer-events:auto; }
  .cz-zoom figcaption a{ display:block; color:inherit; }
  .cz-zoom figcaption strong{ font-weight:600; }
  .cz-zoom figcaption a:hover{ color:var(--oxide); }
  .cz-zoom figcaption a:hover .cz-cap{ text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; }
  /* flechinha de link externo — inline-block para não herdar o sublinhado */
  .cz-ext{ display:inline-block; margin-left:5px; font:12px/1 var(--mono-font); }
  .cz-zoom figcaption a:hover .cz-ext{ color:var(--oxide); }

  /* player de vídeo por cima da página */
  .cz-player{ position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
    background:rgba(255,255,255,.94); padding:16px; }
  .cz-player.on{ display:flex; }
  .cz-player figure{ margin:0; width:min(1100px, 88vw, calc((100vh - 150px) * 16 / 9)); background:var(--card);
    box-shadow:0 18px 50px rgba(32,29,25,.18); padding:0 0 12px; }
  .cz-player .cz-frame{ position:relative; aspect-ratio:16/9; background:#000; }
  .cz-player iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .cz-player figcaption{ padding:10px 12px 0; font:14px/1.4 var(--body-font); color:var(--ink); }
  .cz-player figcaption a{ color:inherit; }
  .cz-player figcaption a:hover{ color:var(--oxide); }
  .cz-player figcaption a:hover .cz-cap{ text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; }
  .cz-player figcaption strong{ font-weight:600; }
  .cz-close{ position:absolute; top:18px; right:22px; border:0; background:none; cursor:pointer;
    font:22px/1 var(--mono-font); color:var(--stone); padding:6px; }
  .cz-close:hover{ color:var(--ink); }

  @media (max-width:760px){
    .cz-player figure{ width:100%; }
    .cz-list{ padding:0 22px 12vh; }
    .cz-row{ grid-template-columns:1fr; gap:10px; }
    .cz-thumb{ display:none; }
    .cz-strip img{ cursor:default; }
    .cz-zoom{ display:none; }
  }

  @media (max-width:800px){
    .top{ flex-direction:column; gap:14px; padding:20px 22px; }
  }
</style>
</head>
<body>
  <header class="top">
    <div class="h">CURADORIA, PESQUISA E EDIÇÃO</div>
    <nav class="main">
      <a href="index.html">HOME</a>
      <a href="projetos.html">PROJETOS</a>
      <a href="arquivo.html">ATLAS FOTOGRÁFICO</a>
      <a href="curadoria.html" class="on">CURADORIA</a>
      <a href="bio.html">BIO</a>
      <a href="#" id="langToggle">EN</a>
    </nav>
  </header>

  <main class="cz-list" id="list"></main>

  <script>
  // ---- camada de dados — vem do Airtable (base Curadoria: Projetos → Itinerâncias).
  // Cada Projeto vira UMA linha: título | tipo · papel + "ano | local" | miniatura.
  // Ao abrir, aparecem o texto, as sedes (itinerâncias) e a fileira de imagens.
  // Editar no Airtable reflete aqui sozinho, sem redeploy. ----
  (async function(){
    const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "pt";
    let ITEMS = [];
    var vtP = function(u){ return /(?:^|; )vt_preview=1(?:;|$)/.test(document.cookie) ? u+(u.indexOf("?")===-1?"?":"&")+"_preview="+Date.now() : u; };
    try {
      const r = await fetch(vtP("/api/curadoria?lang=" + lang));
      if (r.ok) { const d = await r.json(); ITEMS = d.itens || []; }
    } catch (e) { /* sem fallback estático — se a busca falhar, a lista fica vazia */ }

    const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
    // texto formatado do Airtable (markdown): **negrito**, _itálico_ ou *itálico*, quebras de linha
    const md = s => esc(String(s == null ? "" : s).trim())
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^\w])_(.+?)_(?!\w)/g, "$1<em>$2</em>")
      .replace(/\*(.+?)\*/g, "<em>$1</em>")
      .replace(/\n/g, "<br>");
    // texto sem a marcação (para atributos alt)
    const plain = s => esc(String(s == null ? "" : s).replace(/\*/g, "").replace(/(^|[^\w])_(.+?)_(?!\w)/g, "$1$2"));
    // local com link (coluna Link em Projetos/Itinerâncias): abre a página oficial em outra aba
    const venue = (ano, local, link) => `<div class="cz-v"><span class="y">${esc(ano)}</span><span class="l">${link
      ? `<a href="${esc(link)}" target="_blank" rel="noopener"><span class="cz-cap">${md(local)}</span><span class="cz-ext">↗</span></a>`
      : md(local)}</span></div>`;
    const lugar = (local, ano) => [local, ano].filter(Boolean).join(" — ");
    const list = document.getElementById("list");

    list.innerHTML = ITEMS.map(c => {
      const sedes = c.sedes || [];
      // imagens do projeto seguidas das imagens das sedes; legenda da imagem (se houver)
      // substitui "local — ano"
      const imgs = [
        ...(c.imgs || []).map(g => ({ ...g, cap: g.legenda || lugar(c.local, c.ano) })),
        ...sedes.flatMap(s => (s.imgs || []).map(g => ({ ...g, cap: g.legenda || lugar(s.local, s.ano) })))
      ];
      const tr = [c.tipo, c.papel].filter(Boolean).map(md).join(" · ");
      return `<article class="cz-item">
        <div class="cz-row">
          <div>
            <div class="cz-title">${md(c.titulo)}</div>
            ${c.desc ? `<div class="cz-fold"><div><p class="cz-desc">${md(c.desc)}</p></div></div>` : ""}
          </div>
          <div>
            ${tr ? `<div class="cz-tr">${tr}</div>` : ""}
            ${(c.local || c.ano) ? venue(c.ano, c.local, c.link) : ""}
            ${sedes.length ? `<div class="cz-fold"><div class="cz-sedes">${sedes.map(s => venue(s.ano, s.local, s.link)).join("")}</div></div>` : ""}
          </div>
          <div class="cz-thumb">${c.imgs && c.imgs[0] ? `<img src="${esc(c.imgs[0].thumb)}"${c.imgs[0].transp ? ' class="cz-tr"' : ""} alt="${plain(c.titulo)}">` : ""}</div>
        </div>
        ${imgs.length ? `<div class="cz-fold"><div><div class="cz-strip">${imgs.map(g => {
          const attrs = `data-web="${esc(g.web)}" data-cap="${esc(g.cap)}"${g.link ? ` data-link="${esc(g.link)}"` : ""}`;
          const img = `<img src="${esc(g.thumb)}" alt="${plain(c.titulo)}" loading="lazy"`;
          // vídeo: miniatura dentro de um span com o ▶; foto: a própria <img>
          return g.video ? `<span class="cz-vid" data-video="${esc(g.video)}" ${attrs}>${img}><span class="cz-play"></span></span>`
            : `${img} ${attrs}>`;
        }).join("")}</div></div></div>` : ""}
      </article>`;
    }).join("");

    // fechado: clicar em qualquer lugar abre; aberto: só o título fecha. Um aberto por vez.
    list.querySelectorAll(".cz-item").forEach(a => a.addEventListener("click", e => {
      if (e.target.closest("a")) return; // links (local, legenda) não abrem/fecham o item
      const open = a.classList.contains("open");
      if (open && !e.target.closest(".cz-title")) return;
      hide();
      list.querySelectorAll(".cz-item.open").forEach(x => x.classList.remove("open"));
      if (!open) a.classList.add("open");
    }));

    // hover numa imagem da fileira: versão maior flutuando sobre a página (só desktop)
    const canHover = matchMedia("(hover: hover) and (min-width: 761px)");
    const z = document.createElement("figure");
    z.className = "cz-zoom";
    z.innerHTML = '<div class="cz-zi"><img alt=""><span class="cz-play"></span></div><figcaption></figcaption>';
    document.body.appendChild(z);
    const zi = z.querySelector("img"), zc = z.querySelector("figcaption");
    let current = null, hideTimer = null, ready = false;
    const place = () => {
      if (!current || !ready || !canHover.matches) return;
      const r = current.getBoundingClientRect(), w = z.offsetWidth, h = z.offsetHeight;
      // horizontal: sempre no centro da tela (a fileira é que anda, pelas setas)
      const x = Math.max(16, (innerWidth - w) / 2);
      const y = Math.max(70, Math.min(innerHeight - h - 16, r.top + r.height / 2 - h / 2));
      z.style.left = x + "px"; z.style.top = y + "px"; z.classList.add("on");
    };
    const hide = () => { clearTimeout(hideTimer); current = null; ready = false; z.classList.remove("on"); };
    // pequeno atraso para dar tempo de o mouse passar da miniatura para o zoom
    const hideSoon = () => { clearTimeout(hideTimer); hideTimer = setTimeout(hide, 120); };
    // item da fileira sob o evento: a <img> de uma foto ou o <span> de um vídeo
    const stripItem = t => (t && t.closest) ? t.closest(".cz-strip > *") : null;
    // legenda e posição só mudam quando a imagem grande terminou de carregar, para nunca
    // aparecer a legenda de uma foto com a imagem de outra (ou a caixa vazia)
    const apply = () => {
      const t = current;
      // com link: a legenda abre o site em outra aba (o zoom passa a aceitar o mouse)
      // legenda: só o campo Legenda da Galerias (sem ele, "local — ano")
      const texto = `<span class="cz-cap">${md(t.dataset.cap)}</span>${t.dataset.link ? '<span class="cz-ext">↗</span>' : ""}`;
      zc.innerHTML = t.dataset.link
        ? `<a href="${esc(t.dataset.link)}" target="_blank" rel="noopener">${texto}</a>` : texto;
      z.classList.toggle("link", !!t.dataset.link);
      z.classList.toggle("video", !!t.dataset.video);
      ready = true;
      place();
    };
    zi.onload = () => { if (current && zi.getAttribute("src") === current.dataset.web) apply(); };
    const show = t => {
      clearTimeout(hideTimer);
      current = t;
      // pré-carrega a vizinha da direita, para as setas ficarem rápidas
      const nb = t.nextElementSibling;
      if (nb && nb.dataset.web) new Image().src = nb.dataset.web;
      if (zi.getAttribute("src") !== t.dataset.web) { ready = false; zi.src = t.dataset.web; }
      else if (zi.complete) apply();
    };
    // navegando pelas setas: ignora os eventos de mouse "falsos" que o navegador dispara
    // quando a fileira rola sob o cursor parado; volta ao normal quando o mouse se mexe
    let keyNav = false;
    addEventListener("mousemove", () => { keyNav = false; }, { passive: true });

    list.addEventListener("mouseover", e => {
      const m = stripItem(e.target);
      if (keyNav || !canHover.matches || !m) return;
      if (m === current) { clearTimeout(hideTimer); return; }
      show(m);
    });
    list.addEventListener("mouseout", e => {
      const m = stripItem(e.target);
      if (!keyNav && m && m === current && !m.contains(e.relatedTarget) && !z.contains(e.relatedTarget)) hideSoon();
    });
    z.addEventListener("mouseenter", () => clearTimeout(hideTimer));
    z.addEventListener("mouseleave", e => { if (!keyNav && !(current && current.contains(e.relatedTarget))) hideSoon(); });
    // vídeo: clicar na imagem do zoom abre o player
    z.querySelector(".cz-zi").addEventListener("click", () => { if (current && current.dataset.video) play(current); });

    // player do YouTube (youtube-nocookie: sem cookies de rastreamento antes do play)
    const pl = document.createElement("div");
    pl.className = "cz-player";
    pl.innerHTML = '<button class="cz-close" aria-label="Fechar">×</button><figure><div class="cz-frame"></div><figcaption></figcaption></figure>';
    document.body.appendChild(pl);
    const play = t => {
      hide();
      pl.querySelector(".cz-frame").innerHTML =
        `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(t.dataset.video)}?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen"></iframe>`;
      const texto = `<span class="cz-cap">${md(t.dataset.cap)}</span>${t.dataset.link ? '<span class="cz-ext">↗</span>' : ""}`;
      pl.querySelector("figcaption").innerHTML = t.dataset.link
        ? `<a href="${esc(t.dataset.link)}" target="_blank" rel="noopener">${texto}</a>` : texto;
      pl.classList.add("on");
    };
    // fechar tira o iframe, para o vídeo parar de tocar
    const stop = () => { pl.classList.remove("on"); pl.querySelector(".cz-frame").innerHTML = ""; };
    pl.addEventListener("click", e => { if (e.target === pl || e.target.closest(".cz-close")) stop(); });

    // setas ← → percorrem as imagens do item aberto (Esc fecha o zoom; Enter toca um vídeo)
    addEventListener("keydown", e => {
      if (pl.classList.contains("on")) { if (e.key === "Escape") stop(); return; }
      if (e.key === "Escape") { hide(); return; }
      if (e.key === "Enter" && current && current.dataset.video) { play(current); return; }
      if ((e.key !== "ArrowRight" && e.key !== "ArrowLeft") || e.metaKey || e.ctrlKey || e.altKey) return;
      const strip = list.querySelector(".cz-item.open .cz-strip");
      if (!strip) return;
      const imgs = [...strip.children];
      const i = imgs.indexOf(current);
      const next = i === -1 ? imgs[e.key === "ArrowRight" ? 0 : imgs.length - 1]
        : imgs[Math.max(0, Math.min(imgs.length - 1, i + (e.key === "ArrowRight" ? 1 : -1)))];
      e.preventDefault();
      keyNav = true;
      // a fileira anda para deixar a miniatura atual no centro, embaixo do zoom
      next.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
      if (canHover.matches) show(next); else current = next;
    });
    // clicar num vídeo da fileira abre o player; no celular (sem zoom), tocar numa foto
    // com link abre o site
    list.addEventListener("click", e => {
      const m = stripItem(e.target);
      if (!m) return;
      if (m.dataset.video) play(m);
      else if (!canHover.matches && m.dataset.link) open(m.dataset.link, "_blank", "noopener");
    });
    // rolar a página ou a fileira desloca a miniatura: com o mouse, fecha o zoom;
    // pelas setas, o zoom acompanha a miniatura enquanto a fileira rola
    addEventListener("scroll", () => { if (keyNav) place(); else hide(); }, { passive: true, capture: true });
  })();
  </script>
  <script>
  // botão EN/PT — troca o parâmetro ?lang= na URL. Ainda não traduz o conteúdo desta
  // página (só projeto.html lê o Airtable bilíngue por enquanto), mas já fica no lugar.
  (function(){
    var url = new URL(location.href);
    var isEN = url.searchParams.get("lang") === "en";
    var el = document.getElementById("langToggle");
    if(!el) return;
    el.textContent = isEN ? "PT" : "EN";
    el.addEventListener("click", function(e){
      e.preventDefault();
      var u = new URL(location.href);
      u.searchParams.set("lang", isEN ? "pt" : "en");
      location.href = u.toString();
    });
  })();
  </script>
  <script>
  // cor de fundo vem do Airtable (tabela Configurações da base Curadoria, campo "Cor de fundo")
  var vtP2 = function(u){ return /(?:^|; )vt_preview=1(?:;|$)/.test(document.cookie) ? u+(u.indexOf("?")===-1?"?":"&")+"_preview="+Date.now() : u; };
  fetch(vtP2("/api/config?base=curadoria")).then(r=>r.ok?r.json():null).then(d=>{
    if(d && d.corFundo) document.documentElement.style.setProperty("--bg", "#"+d.corFundo.trim().replace(/^#/,""));
    // fundo da caixa da legenda (zoom e player de vídeo): campo "Cor da legenda"
    if(d && d.corLegenda) document.documentElement.style.setProperty("--card", "#"+d.corLegenda.trim().replace(/^#/,""));
    if(d && d.corImagem) document.documentElement.style.setProperty("--cell", "#"+d.corImagem.trim().replace(/^#/,""));
  }).catch(()=>{});
  </script>
  <script src="assets/no-drag.js"></script>
</body>
</html>
