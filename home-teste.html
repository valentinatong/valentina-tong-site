<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Valentina Tong</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#FBFAF7;
    --ink:#201D19;
    --oxide:#9A4A2C;
    --mono-font:"Space Mono", ui-monospace, monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{ background:var(--ink); overflow:hidden; -webkit-font-smoothing:antialiased; }
  a{ text-decoration:none; }

  /* troque só esta foto pra testar outras — qualquer uma de assets/home/home-01.jpg a home-74.jpg */
  .vt-photo{
    position:fixed; inset:0;
    width:100%; height:100%;
    object-fit:contain;   /* mostra a foto inteira, sem cortar — pode sobrar friso da cor de fundo dos lados */
    display:block;
  }
  /* leve escurecida no centro, só o suficiente pra o menu ficar legível em cima de
     qualquer foto — não é um filtro na imagem toda, só um gradiente por trás do texto */
  .vt-veil{
    position:fixed; inset:0;
    background:radial-gradient(ellipse 620px 200px at 50% 50%, rgba(0,0,0,.38), rgba(0,0,0,0) 70%);
    pointer-events:none;
  }

  nav.vt-center{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    display:flex; align-items:center; gap:clamp(28px,4vw,52px);
    z-index:2;
  }
  nav.vt-center a{
    font-family:var(--mono-font);
    font-weight:400;
    font-size:13px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--paper);
    transition:color .2s ease;
    white-space:nowrap;
  }
  nav.vt-center a:hover{ color:var(--oxide); }

  @media (max-width:640px){
    nav.vt-center{ flex-direction:column; gap:18px; text-align:center; }
  }
</style>
</head>
<body>
  <img class="vt-photo" id="heroPhoto" src="assets/home/home-01.jpg" alt="" />
  <div class="vt-veil"></div>

  <nav class="vt-center" aria-label="Menu principal">
    <a href="projeto.html?p=pedras-marcadas">Projetos</a>
    <a href="arquivo.html">Arquivo Fotográfico</a>
    <a href="curadoria.html">Curadoria</a>
    <a href="bio.html">Bio</a>
  </nav>

  <script>
  // foto de capa vem da base "Home" (tabela "Capa", linha marcada "Ativa") no Airtable —
  // trocar lá muda a foto aqui sozinho, sem deploy. Se a busca falhar, fica a foto local acima.
  fetch("/api/home").then(r=>r.ok?r.json():null).then(d=>{
    if(d && d.foto) document.getElementById("heroPhoto").src = d.foto;
  }).catch(()=>{});
  </script>
</body>
</html>
